<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同帳號工作區｜A/B 互動比較</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6f9;color:#244255;font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}button{font:inherit;cursor:pointer;border:1px solid #cddce5;border-radius:9px;padding:10px 16px;background:white;color:inherit}button:hover,button.active{background:#215e78;color:white}button:focus-visible{outline:3px solid #e6ae30;outline-offset:3px}header{background:white;border-bottom:1px solid #d9e4eb;padding:24px max(24px,calc((100vw - 1240px)/2))}h1{font-size:29px;line-height:1.4;margin:5px 0 9px}p{margin:8px 0}small{color:#5b7283}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.tabs button{font-weight:650}main{max-width:1290px;margin:auto;padding:26px}.task{background:#fff0c5;border-left:4px solid #ddb13e;border-radius:8px;padding:15px 20px;margin-bottom:20px}.demo{border:1px solid #cbdce6;border-radius:16px;overflow:hidden;background:white;box-shadow:0 8px 25px #2442550b}.account{padding:16px 24px;background:#edf7fb;display:flex;justify-content:space-between;align-items:center;gap:12px}.account b{display:block}.badge{font-size:13px;background:#d9ede3;padding:4px 9px;border-radius:6px;color:#286446}.switcher{display:flex;padding:12px 24px;gap:10px;border-bottom:1px solid #dbe6eb}.layout{display:grid;grid-template-columns:238px 1fr;min-height:400px}aside{background:#f6f9fb;border-right:1px solid #dbe6eb;padding:20px 15px}aside h3{font-size:13px;color:#5f7787;margin:15px 12px 8px}aside button{display:block;text-align:left;width:100%;margin:5px 0;background:transparent;border:0}aside button.active{background:#e0eef5;color:#225c76;box-shadow:inset 3px 0 #e2b84c}.screen{padding:28px}.screen h2{font-size:25px;margin:0 0 8px}.context{padding:12px 16px;border-radius:8px;background:#eaf3fb;margin:20px 0;border-left:4px solid #599bbc}.context.host{background:#f4edfa;border-color:#9873b3}.case{border:1px solid #dae5eb;border-radius:12px;padding:21px;max-width:760px}.case h3{margin:5px 0 12px}.rows{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:15px 0}.rows small{display:block}.muted{color:#5b7283;font-size:14px}.analysis{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}.analysis section{padding:21px;border:1px solid #d8e4eb;background:white;border-radius:13px}.analysis h3{margin:0 0 8px}.result{margin-top:15px;color:#266b57;font-weight:600}.toolbar{display:flex;gap:10px;align-items:center}.count{font-size:14px;color:#5b7283}.eyebrow{font-size:12px;letter-spacing:1.6px;color:#257783;font-weight:700}@media(max-width:700px){.layout{grid-template-columns:1fr}aside{display:flex;gap:8px;overflow:auto;padding:10px}aside h3{min-width:85px}aside button{white-space:nowrap;width:auto}.analysis{grid-template-columns:1fr}.account,.top{align-items:flex-start;flex-direction:column}.screen{padding:20px}.rows{grid-template-columns:1fr}.switcher{padding:12px;flex-wrap:wrap}main{padding:18px}}</style>
<header><div class="top"><div><div class="eyebrow">UI COMPARISON · 同一帳號，兩種介面</div><h1>學校與承辦工作，要怎麼放才順手？</h1><p>示範國小 B 同時有一般學校及競賽承辦權限。兩種方案都不用重新登入。</p></div><span class="badge">設計比較 · 尚未定案</span></div><div class="tabs"><button id="a" class="active">A｜同一工作區・分組選單（建議）</button><button id="b">B｜兩個工作區・頁首切換</button></div></header>
<main><div class="task"><strong>試做一個任務：</strong>先看本校待補件案件，再去審核別校送來的報名，最後回到本校案件。<br><small>只操作左側選單與工作區切換，感受哪一種比較不容易迷路。</small></div><div id="demo" class="demo"></div><div id="analysis" class="analysis"></div><p class="muted">這是互動線框範例，資料獨立於正式 demo，不會變更任何報名案件。點擊次數只計選單／切換工作區；不是實際使用者研究結果。</p></main>
<script>
let mode='A',zone='school',tab='own',clicks=0;
const list={school:[['own','我的報名／補件'],['survey','線上填報'],['resources','教學資源與成果上傳']],host:[['review','報名審核'],['settings','競賽設定'],['reports','名冊與公告']]};
function section(z){return `<h3>${z==='school'?'學校作業':'競賽承辦'}</h3>${list[z].map(([id,label])=>`<button data-tab="${id}" data-zone="${z}" class="${tab===id?'active':''}">${label}</button>`).join('')}`;}
function render(){document.querySelector('#a').className=mode==='A'?'active':'';document.querySelector('#b').className=mode==='B'?'active':'';const own=tab==='own',review=tab==='review',host=zone==='host';const title=own?'我的報名／補件':review?'報名審核':list[zone].find(r=>r[0]===tab)[1];document.querySelector('#demo').innerHTML=`<div class="account"><div><b>英語教育資源中心｜${mode==='A'?'學校工作區':host?'競賽承辦工作區':'一般學校工作區'}</b><small>登入帳號：示範老師 B · 所屬學校：示範國小 B</small></div><div><span class="badge">一般學校＋承辦權限</span></div></div>${mode==='B'?`<div class="switcher"><button data-switch="school" class="${!host?'active':''}">一般學校工作區</button><button data-switch="host" class="${host?'active':''}">競賽承辦工作區</button></div>`:''}<div class="layout"><aside>${mode==='A'?section('school')+section('host'):section(zone)}</aside><section class="screen"><div class="toolbar"><span class="eyebrow">${host?'ORGANIZER TASK':'SCHOOL TASK'}</span><span class="count">本次選單操作 ${clicks} 次</span></div><h2>${title}</h2><div class="context ${host?'host':''}"><strong>${host?'正在處理承辦業務':'正在處理本校業務'}</strong><br>${host?'承辦單位：示範國小 B｜競賽：英語朗讀競賽':'資料所屬：示範國小 B｜競賽：英語朗讀競賽'}</div><article class="case">${own?`<span class="badge">本校案件 · 待補件</span><h3>B-001｜示範國小 B 的參賽報名</h3><div class="rows"><div><small>審核意見</small>請補上授權書簽名頁。</div><div><small>下一步</small>補齊文件，再重新送出。</div></div><p class="muted">這裡處理的是自己學校的報名，與承辦別校案件分開。</p>`:review?`<span class="badge">別校案件 · 待審查</span><h3>A-001｜示範國小 A 的參賽報名</h3><div class="rows"><div><small>送件學校</small>示範國小 A</div><div><small>審核人所屬</small>示範國小 B（承辦）</div></div><p class="muted">這裡只顯示本校獲授權承辦的競賽案件。是否可審本校案件尚待確認。</p>`:`<h3>${title}</h3><p>本區示意選單位置，不在比較範例實作表單內容。</p>`}</article></section></div>`;
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{zone=b.dataset.zone;tab=b.dataset.tab;clicks++;render();});document.querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>{zone=b.dataset.switch;tab=zone==='school'?'own':'review';clicks++;render();});document.querySelector('#analysis').innerHTML=mode==='A'?`<section><h3>為什麼我推薦 A</h3><p>兩組任務同時可見，從本校案件到承辦審核只需點目標頁面；不必先記住功能在哪個工作區。</p><p>新增承辦權限時增加一組選單，一般學校看到的基本操作保持一致。</p></section><section><h3>需要做好什麼</h3><p>承辦功能多時選單會變長，可折疊分組。每頁持續顯示資料所屬學校與競賽，避免把本校參賽資料和別校審核混在一起。</p></section>`:`<section><h3>B 的優點</h3><p>每個工作區選單較短，任務界線明顯。適合承辦功能很多，而且通常連續處理同一類工作的情境。</p></section><section><h3>B 的代價</h3><p>要先知道目前在哪個工作區。若目標頁面不是切換後的預設頁，會多一步操作；切換也需要保留尚未送出的表單。</p><p>本範例把審核設為預設頁，所以特定路徑的點擊次數可能與 A 相同，不代表所有任務都一樣。</p></section>`;}
document.querySelector('#a').onclick=()=>{mode='A';zone='school';tab='own';clicks=0;render();};document.querySelector('#b').onclick=()=>{mode='B';zone='school';tab='own';clicks=0;render();};render();
</script></html>
